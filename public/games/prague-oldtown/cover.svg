<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f06"/>
      <stop offset="100%" stop-color="#2b1d0e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c4956a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2b1d0e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <!-- Glow -->
  <ellipse cx="400" cy="380" rx="500" ry="200" fill="url(#glow)"/>
  <!-- Prague silhouette -->
  <g fill="#3d2a18">
    <!-- Buildings baseline -->
    <rect x="0" y="300" width="800" height="100"/>
    <!-- Tyn Church towers -->
    <rect x="280" y="180" width="18" height="120"/>
    <rect x="330" y="180" width="18" height="120"/>
    <polygon points="289,180 271,140 307,140" />
    <polygon points="339,180 321,140 357,140" />
    <polygon points="289,140 280,120 298,120" />
    <polygon points="339,140 330,120 348,120" />
    <!-- Tyn Church body -->
    <rect x="275" y="240" width="78" height="60"/>
    <polygon points="275,240 314,210 353,240" />
    <!-- Old Town Hall tower -->
    <rect x="140" y="160" width="25" height="140"/>
    <polygon points="140,160 152,130 165,160" />
    <!-- Powder Tower -->
    <rect x="550" y="190" width="22" height="110"/>
    <polygon points="550,190 561,155 572,190" />
    <rect x="545" y="270" width="32" height="30"/>
    <!-- St. Nicholas dome -->
    <path d="M460,300 Q460,240 490,230 Q520,240 520,300 Z"/>
    <rect x="485" y="210" width="10" height="25"/>
    <!-- Generic buildings -->
    <rect x="60" y="270" width="80" height="30"/>
    <rect x="180" y="280" width="60" height="20"/>
    <rect x="380" y="280" width="50" height="20"/>
    <rect x="420" y="275" width="35" height="25"/>
    <rect x="590" y="280" width="70" height="20"/>
    <rect x="680" y="270" width="60" height="30"/>
    <rect x="10" y="280" width="40" height="20"/>
  </g>
  <!-- Orloj clock face -->
  <circle cx="152" cy="230" r="18" fill="#2b1d0e" stroke="#c4956a" stroke-width="2"/>
  <circle cx="152" cy="230" r="14" fill="none" stroke="#c4956a" stroke-width="0.5"/>
  <line x1="152" y1="230" x2="152" y2="220" stroke="#c4956a" stroke-width="1.5"/>
  <line x1="152" y1="230" x2="160" y2="234" stroke="#c4956a" stroke-width="1"/>
  <!-- Stars -->
  <g fill="#c4956a" opacity="0.6">
    <circle cx="100" cy="60" r="1.5"/>
    <circle cx="250" cy="40" r="1"/>
    <circle cx="400" cy="30" r="1.5"/>
    <circle cx="550" cy="55" r="1"/>
    <circle cx="700" cy="35" r="1.5"/>
    <circle cx="150" cy="90" r="1"/>
    <circle cx="650" cy="80" r="1"/>
    <circle cx="350" cy="70" r="1.5"/>
    <circle cx="500" cy="45" r="1"/>
    <circle cx="50" cy="50" r="1"/>
    <circle cx="750" cy="65" r="1"/>
  </g>
  <!-- Title text -->
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#c4956a" font-weight="bold" letter-spacing="4">
    STARE MESTO
  </text>
  <text x="400" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c4956a" opacity="0.7" letter-spacing="2">
    PRAHRA
  </text>
</svg>
